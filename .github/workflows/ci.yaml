name: validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.2.1'}
      - run: gradle --no-daemon check :modsync-server:bootJar :modsync-agent:installDist :modsync-client:installDist :modsync-client-tui:installDist
      - run: python3 scripts/check-architecture.py
      - run: python3 scripts/openapi.py --check
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/repository -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/backup -p 'test_*.py'
      - run: python3 scripts/integration/distributed.py
      - uses: aquasecurity/trivy-action@0.33.1
        with: {scan-type: fs, scan-ref: '.', exit-code: '1', severity: 'HIGH,CRITICAL'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: |
            **/build/reports/tests/
            .local/integration/results.json
