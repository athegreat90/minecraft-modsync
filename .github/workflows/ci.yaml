name: validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '25'}
      - uses: actions/setup-node@v6
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: gradle/actions/setup-gradle@v6
        with: {gradle-version: '9.9.1'}
      - run: gradle --no-daemon check dokkaGenerate :modsync-server:bootJar :modsync-agent:installDist :modsync-client:installDist :modsync-client-tui:installDist
      - run: python3 scripts/check-architecture.py
      - run: python3 scripts/openapi.py --check
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/repository -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/backup -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/docs -p 'test_*.py'
      - run: python3 scripts/docs/check_links.py
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: {version: v0.76.2, scan-type: fs, scan-ref: '.', exit-code: '1', severity: 'HIGH,CRITICAL'}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-evidence
          path: |
            **/build/reports/tests/
            **/build/test-results/test/*.xml
            build/reports/problems/

  # Angular lint and unit tests run beside the Kotlin jobs, so they stay off the critical path. The production build
  # itself happens once, inside `validate`, through the server's processResources.
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test

  # Runs beside `validate` in its own workspace, so the disposable TLS keys it generates are never scanned as source.
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '25'}
      - run: python3 scripts/integration/distributed.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-evidence
          include-hidden-files: true
          path: .local/integration/results.json

  # SonarQube is only reachable inside the tailnet. The job joins it as an ephemeral, ACL-restricted tag:ci node using
  # workload identity federation (no long-lived Tailscale secret). It never runs for pull requests (untrusted code must
  # not obtain OIDC tokens or secrets), and the federated identity only trusts refs/heads/main of this repository.
  # Traffic to the tailnet IP is plain HTTP but stays inside the WireGuard tunnel; TLS verification is never disabled.
  sonar:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'http://100.96.151.13:9000' }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          args: --accept-dns=false
      - name: Verify SonarQube is reachable over Tailscale
        run: |
          tailscale status
          curl --fail --silent --show-error --max-time 20 "$SONAR_HOST_URL/api/system/status"
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '25'}
      - uses: actions/setup-node@v6
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: gradle/actions/setup-gradle@v6
        with: {gradle-version: '9.9.1'}
      # The Angular unit tests produce the LCOV report SonarQube reads; the paths are made relative to the repository root.
      - run: npm ci --no-audit --no-fund && npm run test:coverage && sed -i 's#^SF:#SF:frontend/#' coverage/frontend/lcov.info
        working-directory: frontend
      # SonarQube only reads the JaCoCo reports and the compiled classes, so the lint, Dokka and boundary checks that `validate`
      # already runs are not repeated here. --info prints per-sensor timings: the analysis, not the build, dominates this job.
      - run: gradle --no-daemon --info -x :modsync-server:installFrontend test jacocoTestReport sonar "-Dsonar.host.url=$SONAR_HOST_URL" -Dsonar.qualitygate.wait=true