name: validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.8.2'}
      - run: gradle --no-daemon check dokkaGenerate :modsync-server:bootJar :modsync-agent:installDist :modsync-client:installDist :modsync-client-tui:installDist
      - run: python3 scripts/check-architecture.py
      - run: python3 scripts/openapi.py --check
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/repository -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/backup -p 'test_*.py'
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: {scan-type: fs, scan-ref: '.', exit-code: '1', severity: 'HIGH,CRITICAL'}
      # Scan source before the fixture generates disposable TLS keys.
      - run: python3 scripts/integration/distributed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          include-hidden-files: true
          path: |
            **/build/reports/tests/
            **/build/test-results/test/*.xml
            build/reports/problems/
            .local/integration/results.json

  # Self-hosted SonarQube is only reachable from a trusted runner inside the private network. It never runs for
  # pull requests (untrusted code must not reach privileged runners or secrets) and the token comes only from the secret.
  sonar:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: [self-hosted, sonarqube-access]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.8.2'}
      - run: gradle --no-daemon check sonar -Dsonar.host.url=https://sonarqube.alexandermora.de -Dsonar.qualitygate.wait=true