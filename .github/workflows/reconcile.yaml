name: reconcile-main-releases
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: release-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: vars.MODSYNC_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: python3 scripts/release/reconcile.py
        env: {GH_TOKEN: '${{ github.token }}'}
