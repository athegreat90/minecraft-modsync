name: reconcile-main-releases
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  packages: read
concurrency:
  group: release-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ github.token }}'}
      - run: python3 scripts/release/reconcile.py
        env: {GH_TOKEN: '${{ github.token }}'}
