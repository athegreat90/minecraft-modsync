name: reconcile-main-releases
on:
  # Releases follow the `validate` workflow (tests, Detekt, SonarQube quality gate), never the push itself.
  workflow_run:
    workflows: [validate]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  packages: read
concurrency:
  group: release-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: {ref: main, fetch-depth: 0}
      # Hourly and manual runs must not bypass SonarQube either: the tip of main needs a successful `validate` run.
      - name: Require a successful validation of the main tip
        if: github.event_name != 'workflow_run'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          tip=$(git rev-parse HEAD)
          result=$(gh run list --workflow ci.yaml --branch main --commit "$tip" --event push --json conclusion --jq '[.[].conclusion] | first // "none"')
          echo "validate result for $tip: $result"
          [ "$result" = success ]
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ github.token }}'}
      - run: python3 scripts/release/reconcile.py
        env: {GH_TOKEN: '${{ github.token }}'}
