name: modsync-agent
services:
  agent:
    image: ${MODSYNC_AGENT_IMAGE:-minecraft-modsync-agent:local}
    build:
      context: ../..
      dockerfile: docker/agent/Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    environment:
      MODSYNC_SERVER_URL: ${MODSYNC_SERVER_URL:?Set the trusted HTTPS API endpoint}
      MODSYNC_SCAN_INTERVAL: ${MODSYNC_SCAN_INTERVAL:-300}
      MODSYNC_STATE_DIR: /app/state
    volumes:
      - ${MODSYNC_STATE_PATH:?Set writable agent state path}:/app/state
      - ${MINECRAFT_SERVERS_PATH:?Set actual host Crafty server directory}:/minecraft:ro
