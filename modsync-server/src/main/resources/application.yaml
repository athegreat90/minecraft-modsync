server:
  port: 8080
  # Set MODSYNC_FORWARD_HEADERS=framework only behind a reverse proxy you control, so redirects use the public https address.
  forward-headers-strategy: ${MODSYNC_FORWARD_HEADERS:none}
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 2MB
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${MODSYNC_SESSION_COOKIE_SECURE:true}
spring:
  http:
    converters:
      preferred-json-mapper: kotlinx-serialization
  datasource:
    url: ${MODSYNC_DB_URL:jdbc:mariadb://mariadb:3306/modsync}
    username: ${MODSYNC_DB_USER:modsync}
    password: ${MODSYNC_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_instant_jdbc_type: TIMESTAMP
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
modsync:
  bootstrap-user: ${MODSYNC_BOOTSTRAP_USER:admin}
  bootstrap-password-file: ${MODSYNC_BOOTSTRAP_PASSWORD_FILE:}
  maintenance: ${MODSYNC_MAINTENANCE:false}
  # Single sign-on is active only for providers whose client id is set; with none set the application behaves as before.
  sso:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
logging:
  structured:
    format:
      console: ecs
